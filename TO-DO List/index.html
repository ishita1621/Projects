<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
<main class="todo-container">

    <header class="todo-header">
        <h1>My Tasks</h1>
        <p>Stay organized and get things done.</p>
    </header>

    <form class="todo-form">
        <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
        >

        <button type="submit">Add</button>
        <p class="error-message" id="error-message"></p>
    </form>

    <div class="filters">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" aria-label="Task list">
        <!-- <li class="todo-item">
        <div class="todo-content">
            <input type="checkbox">
            <span>Learn JavaScript</span>
        </div>

        <button type="button" class="delete-btn">Delete</button>
    </li> -->
    </ul>

    <footer class="todo-footer">
       <span id="task-count">0 tasks remaining</span>
        <button type="button" id="clear-completed">Clear completed</button>
    </footer>

</main>

<script src="index.js"></script>
    
</body>

</html>
